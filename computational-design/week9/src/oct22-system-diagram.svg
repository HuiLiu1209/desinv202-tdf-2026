eight="80" rx="8" fill="#f6f8fa" stroke="#8c9aa5"/><text x="375.0" y="188.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1d2933">Context</text><text x="375.0" y="211.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1d2933">assembly</text><rect x="510" y="155" width="190" height="80" rx="8" fill="#f6f8fa" stroke="#8c9aa5"/><text x="605.0" y="188.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1d2933">Llama 3.1</text><text x="605.0" y="211.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1d2933">8B Instruct</text><rect x="750" y="155" width="225" height="80" rx="8" fill="#f6f8fa" stroke="#8c9aa5"/><text x="862.5" y="188.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1d2933">Draft resignation</text><text x="862.5" y="211.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1d2933">email</text><rect x="690" y="300" width="285" height="90" rx="8" fill="#f6f8fa" stroke="#8c9aa5"/><text x="832.5" y="327.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1d2933">Designer checks facts,</text><text x="832.5" y="350.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1d2933">disclosure, commitments</text><text x="832.5" y="373.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1d2933">and word count</text><text x="370" y="399" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#52616b">Revise instructions between sessions</text></svg>